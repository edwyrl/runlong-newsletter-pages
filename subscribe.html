<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="订阅 Runlong Newsletter 财经新闻报告">
  <title>订阅 Runlong Newsletter</title>
  <style>
    :root { color-scheme: light; --ink: #172033; --muted: #536078; --line: #dfe4ec; --primary: #2457d6; --primary-dark: #173b98; --surface: #fff; --bg: #f6f7f9; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; background: var(--bg); color: var(--ink); font: 16px/1.6 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: min(100% - 32px, 560px); margin: 10vh auto; padding: 36px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 18px 50px #17203312; }
    .eyebrow { margin: 0 0 12px; color: var(--primary); font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    h1 { margin: 0 0 12px; font-size: clamp(28px, 7vw, 40px); line-height: 1.15; letter-spacing: -.03em; }
    .intro { margin: 0 0 28px; color: var(--muted); }
    label { display: block; margin-bottom: 8px; font-weight: 650; }
    input[type="email"] { width: 100%; min-height: 48px; padding: 12px 14px; border: 1px solid #b8c1d1; border-radius: 10px; color: var(--ink); background: #fff; font: inherit; }
    input:focus { outline: 3px solid #2457d633; border-color: var(--primary); }
    button { width: 100%; min-height: 48px; margin-top: 16px; padding: 12px 16px; border: 0; border-radius: 10px; color: #fff; background: var(--primary); font: inherit; font-weight: 700; cursor: pointer; transition: background .2s ease, transform .2s ease; }
    button:hover { background: var(--primary-dark); }
    button:active { transform: scale(.99); }
    button:disabled { cursor: wait; opacity: .6; }
    .fine-print { margin: 16px 0 0; color: var(--muted); font-size: 13px; }
    .message { min-height: 28px; margin-top: 18px; color: var(--muted); }
    .message.error { color: #a12626; }
    .message.success { color: #17653b; }
    @media (max-width: 640px) { main { margin: 6vh auto; padding: 28px 22px; } }
    @media (prefers-reduced-motion: reduce) { button { transition: none; } }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Runlong Newsletter</p>
    <h1>订阅财经新闻报告</h1>
    <p class="intro">接收经过整理的市场新闻、产业链影响和风险提示。提交后请查收确认邮件。</p>
    <form id="subscribe-form" novalidate>
      <label for="email">邮箱地址</label>
      <input id="email" name="email" type="email" autocomplete="email" inputmode="email" required aria-describedby="email-help">
      <p id="email-help" class="fine-print">我们只会使用这个邮箱发送 Newsletter，并在邮件中提供退订链接。</p>
      <div id="turnstile-container" aria-label="人机验证"></div>
      <button id="submit-button" type="submit">发送确认邮件</button>
      <p id="message" class="message" role="status" aria-live="polite"></p>
    </form>
  </main>
  <script>
    const FUNCTION_BASE = "https://dizhbjbmuwbpivpvahkj.supabase.co/functions/v1";
    const TURNSTILE_SITE_KEY = "0x4AAAAAAEGSNEei8gjcFQmM";
    const form = document.querySelector("#subscribe-form");
    const input = document.querySelector("#email");
    const button = document.querySelector("#submit-button");
    const message = document.querySelector("#message");
    let turnstileToken = "";

    if (!TURNSTILE_SITE_KEY.startsWith("YOUR_")) {
      const script = document.createElement("script");
      script.src = "https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit";
      script.async = true;
      script.defer = true;
      script.onload = () => window.turnstile.render("#turnstile-container", { sitekey: TURNSTILE_SITE_KEY, callback: (token) => { turnstileToken = token; } });
      document.head.appendChild(script);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      message.className = "message";
      message.textContent = "";
      if (!input.validity.valid) {
        input.focus();
        message.className = "message error";
        message.textContent = "请输入有效的邮箱地址。";
        return;
      }
      button.disabled = true;
      button.textContent = "正在发送…";
      try {
        const response = await fetch(`${FUNCTION_BASE}/subscribe`, {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ email: input.value, turnstile_token: turnstileToken })
        });
        const result = await response.json();
        if (!response.ok || !result.ok) throw new Error(result.error || "提交失败，请稍后重试。");
        message.className = "message success";
        message.textContent = result.state === "already_active" ? "这个邮箱已经订阅，无需重复操作。" : "确认邮件已发送，请打开邮件完成订阅。";
        form.reset();
      } catch (error) {
        message.className = "message error";
        message.textContent = error.message || "提交失败，请稍后重试。";
      } finally {
        button.disabled = false;
        button.textContent = "发送确认邮件";
      }
    });
  </script>
</body>
</html>
