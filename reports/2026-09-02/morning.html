<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>财经新闻早报｜2026-09-02</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --paper: #ffffff;
      --text: #172033;
      --muted: #667085;
      --line: #d9dee7;
      --accent: #1f6feb;
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      line-height: 1.72;
    }
    main {
      box-sizing: border-box;
      width: min(960px, 100%);
      margin: 0 auto;
      padding: 28px 18px 48px;
    }
    article {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 28px;
      box-shadow: 0 8px 30px rgba(15, 23, 42, 0.06);
    }
    .meta {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 14px;
    }
    h1, h2, h3, h4 {
      line-height: 1.35;
      margin: 28px 0 12px;
      color: #101828;
    }
    h1 { font-size: 28px; margin-top: 0; }
    h2 { font-size: 22px; border-top: 1px solid var(--line); padding-top: 22px; }
    h3 { font-size: 18px; }
    p { margin: 10px 0; }
    ul, ol { padding-left: 24px; margin: 10px 0 16px; }
    li { margin: 5px 0; }
    strong { color: #0f172a; }
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 14px 0 22px;
      font-size: 14px;
      display: block;
      overflow-x: auto;
    }
    th, td {
      border: 1px solid var(--line);
      padding: 8px 10px;
      text-align: left;
      vertical-align: top;
    }
    th { background: #f2f4f7; font-weight: 700; }
    a { color: var(--accent); }
    @media (max-width: 640px) {
      main { padding: 12px 10px 32px; }
      article { border-radius: 0; padding: 18px; }
      h1 { font-size: 23px; }
      h2 { font-size: 19px; }
    }
  </style>
</head>
<body>
  <main>
    <article>
      <p class="meta">生成日期：2026-09-02 · 类型：早报</p>
      <h1>晨间整合报告（2026-09-02）｜</h1>
    </article>
  </main>
</body>
</html>
